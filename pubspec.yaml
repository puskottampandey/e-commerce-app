name: e_commerce_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  go_router: ^17.1.0
  firebase_core: ^4.5.0  
  firebase_auth: ^6.3.0
  get_it: ^9.2.1
  equatable: ^2.0.8
  dartz: ^0.10.1
  cloud_firestore: ^6.2.0
  flutter_bloc: ^9.1.1
  flutter_spinkit: ^5.2.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: "^0.14.4"
  flutter_lints: ^6.0.0
flutter_icons:
  android: "ic_launcher"
  ios: true
  remote_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "assets/images/app_icon_background.png"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png" 


flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/gif/



  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/static/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/GoogleSans-SemiBold.ttf
          weight: 600
          
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
